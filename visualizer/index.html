<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RL Algorithm Atlas — Interactive Lineage Explorer</title>
    <!--
      Apply theme synchronously before paint.
      Default is LIGHT — matches the parent site's brand. We intentionally do
      NOT fall back to prefers-color-scheme: the visitor picks via the toggle.
      Respects localStorage.theme only if explicitly set to 'light' or 'dark'.
    -->
    <script>
      (function () {
        var t = 'light';
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'light' || stored === 'dark') t = stored;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
      integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+"
      crossorigin="anonymous"
    />
    <meta
      name="description"
      content="An interactive, verification-first lineage of reinforcement learning algorithms — each equation traces to its source paper."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
