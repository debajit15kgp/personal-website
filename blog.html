<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Debajit</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Didot:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #fefbf3;
            color: #232323;
            font-family: 'Didot', serif;
        }
        #back-btn {
            position: fixed;
            top: 8px;
            left: 22px;
            width: 36px;
            height: 36px;
            background: none;
            border: none;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            cursor: pointer;
            transition: background 0.18s;
        }
        #back-btn:hover {
            background: #ececec;
        }
        #back-btn svg {
            width: 22px;
            height: 22px;
            stroke: #232323;
            stroke-width: 2.5;
            fill: none;
        }
        .container {
            display: flex;
            width: 100vw;
            min-height: 100vh;
        }
        /* Left Sidebar */
        .sidebar {
            width: 280px;
            background: #faf9f6;
            border-right: 1.5px solid #ececec;
            padding: 2rem 1.5rem;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            box-shadow: 2px 0 16px rgba(0,0,0,0.03);
        }
        /* Main Content - Table Layout */
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 2rem 3rem;
            overflow-x: auto;
        }
        .main-content h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #232323;
        }
        .blogs-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .blogs-table thead {
            background: #faf9f6;
            border-bottom: 2px solid #ececec;
        }
        .blogs-table th {
            padding: 0.8rem 1rem;
            text-align: left;
            font-weight: 600;
            color: #232323;
            font-size: 0.9rem;
            border-right: 1px solid #ececec;
        }
        .blogs-table th:last-child {
            border-right: none;
        }
        .blogs-table td {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid #ececec;
            border-right: 1px solid #ececec;
            color: #444;
            font-family: 'Helvetica Neue', sans-serif;
        }
        .blogs-table td:last-child {
            border-right: none;
        }
        .blogs-table tbody tr {
            transition: background 0.15s;
            cursor: pointer;
        }
        .blogs-table tbody tr:hover {
            background: #faf9f6;
        }
        .blog-title {
            font-weight: 500;
            color: #232323;
            font-family: 'Didot', serif;
        }
        .blog-date {
            color: #666;
            font-size: 0.8rem;
        }
        .blog-preview {
            color: #666;
            max-width: 500px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .blog-content {
            display: none;
            margin-top: 2rem;
            padding: 2rem;
            background: #fff;
            border: 1px solid #ececec;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .blog-content.active {
            display: block;
        }
        .blog-content h2 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #232323;
        }
        .blog-content .blog-date {
            font-size: 0.85rem;
            color: #999;
            margin-bottom: 1.5rem;
        }
        .blog-content .content-body {
            font-family: 'Helvetica Neue', sans-serif;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #444;
        }
        .blog-content .content-body p {
            margin-bottom: 1rem;
        }
        .close-content {
            float: right;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #666;
            cursor: pointer;
            padding: 0;
            line-height: 1;
            transition: color 0.2s;
        }
        .close-content:hover {
            color: #232323;
        }
        @media (max-width: 968px) {
            .sidebar {
                width: 240px;
            }
            .main-content {
                margin-left: 240px;
                padding: 1.5rem 2rem;
            }
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                position: relative;
                height: auto;
                max-height: none;
            }
            .main-content {
                margin-left: 0;
                padding: 1.5rem 1rem;
            }
            .blogs-table {
                font-size: 0.75rem;
            }
            .blogs-table th,
            .blogs-table td {
                padding: 0.6rem 0.8rem;
            }
        }
    </style>
</head>
<body>
    <button id="back-btn" onclick="window.location.href='index.html'" aria-label="Back">
        <svg viewBox="0 0 24 24">
            <path d="M15 5l-7 7 7 7"/>
        </svg>
        </button>
    
    <div class="container">
        <!-- Left Sidebar (currently empty, no social links) -->
        <aside class="sidebar"></aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <h1>Blog Posts</h1>
            <table class="blogs-table">
                <thead>
                    <tr>
                        <th style="width: 5%;">#</th>
                        <th style="width: 30%;">Title</th>
                        <th style="width: 15%;">Date</th>
                        <th style="width: 50%;">Preview</th>
                    </tr>
                </thead>
                <tbody id="blogs-tbody">
                    <!-- Blogs will be loaded here -->
                </tbody>
            </table>
            <div id="blog-content" class="blog-content">
                <!-- Blog content will be displayed here -->
            </div>
        </main>
    </div>
    
    <script>
        // Load blogs from JSON files
        async function loadBlogs() {
            // Get all JSON files from blogs folder
            const blogFiles = ['blogs/note1.json', 'blogs/rl-for-noobs.json']; // Add more files as needed: 'blogs/note2.json', etc.
            const blogs = [];
            
            for (const file of blogFiles) {
                try {
                    const response = await fetch(file);
                    if (response.ok) {
                        const blog = await response.json();
                        blogs.push(blog);
                    }
                } catch (error) {
                    console.error(`Error loading ${file}:`, error);
                }
            }
            
            // Sort by date (newest first)
            blogs.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            return blogs;
        }
        
        // Strip HTML tags for preview
        function stripHtml(html) {
            const tmp = document.createElement('DIV');
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || '';
        }
        
        // Format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }
        
        // Render blogs table
        async function renderBlogsTable() {
            const blogs = await loadBlogs();
            const tbody = document.getElementById('blogs-tbody');
            
            if (blogs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #999;">No blogs available yet.</td></tr>';
                return;
            }
            
            tbody.innerHTML = blogs.map((blog, index) => {
                const preview = stripHtml(blog.content).substring(0, 100) + '...';
                return `
                    <tr onclick="showBlogContent(${index})">
                        <td>${index + 1}</td>
                        <td class="blog-title">${blog.title}</td>
                        <td class="blog-date">${formatDate(blog.date)}</td>
                        <td class="blog-preview">${preview}</td>
                    </tr>
                `;
            }).join('');
            
            // Store blogs globally for content display
            window.blogs = blogs;
        }
        
        // Show blog content
        function showBlogContent(index) {
            const blog = window.blogs[index];
            const contentDiv = document.getElementById('blog-content');
            
            contentDiv.innerHTML = `
                <button class="close-content" onclick="closeBlogContent()">&times;</button>
                <h2>${blog.title}</h2>
                <div class="blog-date">${formatDate(blog.date)}</div>
                <div class="content-body">${blog.content}</div>
            `;
            
            contentDiv.classList.add('active');
            contentDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        
        // Close blog content
        function closeBlogContent() {
            const contentDiv = document.getElementById('blog-content');
            contentDiv.classList.remove('active');
        }
        
        // Keyboard navigation - Escape key to go back
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
                const contentDiv = document.getElementById('blog-content');
                if (contentDiv.classList.contains('active')) {
                    closeBlogContent();
                } else {
            sessionStorage.setItem('showRoomScene', 'true');
            window.location.href = 'index.html';
        }
            }
        });
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            renderBlogsTable();
    });
    </script>
</body>
</html>
